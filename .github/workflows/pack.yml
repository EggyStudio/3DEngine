# Tests the engine on Linux, Windows and macOS (test.yml), then packs it and its `dotnet new`
# templates, when run from the Actions tab ("Run workflow"), and pushes both packages to nuget.org
# when asked to. Nothing is packed unless every test job passes.
#
# The version is build/version.sh's: the major and minor in build/version.txt, and as the patch the
# commits since that file last changed. The package and its symbols are kept as the run's artifact
# either way, so a pack can be checked, or uploaded by hand, before one is pushed.
name: pack

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push the package to nuget.org (needs the NUGET_API_KEY secret)'
        type: boolean
        default: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  pack:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      # The whole history, since the patch counts commits.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v6
        with:
          path: build/tools/slang
          key: slang-${{ runner.os }}-${{ hashFiles('build/fetch-slang.sh') }}

      - run: build/fetch-slang.sh

      - name: Work out the version
        id: version
        run: echo "version=$(build/version.sh)" >> "$GITHUB_OUTPUT"

      # The engine is packed with its portable code and, for each of the six systems it runs on,
      # compiled ahead (ReadyToRun), which pack.sh publishes from here for all of them.
      - run: build/pack.sh "${{ steps.version.outputs.version }}"

      # What the package holds, read from the .nupkg before it is offered: the engine and its
      # compiled-ahead images, its generator, documentation, compiled shaders, readme, license,
      # notices and release notes, and its dependencies' native libraries for each system
      # BUILDING.md claims.
      - name: Check what the package holds
        env:
          E3D_REQUIRE_PACKAGE: '1'
        run: dotnet test 3DEngine.Tests -c Release --filter "FullyQualifiedName~PackageContentsTests"

      - uses: actions/upload-artifact@v7
        with:
          name: 3DEngine-${{ steps.version.outputs.version }}
          path: |
            build/package/*.nupkg
            build/package/*.snupkg

      - name: Push to nuget.org
        if: ${{ inputs.publish }}
        run: dotnet nuget push "build/package/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Say what was made
        run: |
          echo "### 3DEngine ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.publish }}" = "true" ]; then
            echo "Pushed to nuget.org." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Packed and kept as this run's artifact, not pushed." >> "$GITHUB_STEP_SUMMARY"
          fi
