# Run by hand from the Actions tab ("Run workflow"). It runs the build workflow whole (build.yml, with
# pack set), which adds to what a push runs every example captured on Linux for the gallery and
# measured against raylib's program, every game played, captured, soaked and resized and the README
# followed on Linux, every example captured on the macOS runner's GPU, and every game played on
# Windows and macOS. Then it packs the engine and its `dotnet new` templates, and pushes both
# packages to nuget.org when asked to, through nuget.org's trusted publishing, a policy on nuget.org
# for this repository's pack.yml that answers the run's identity with a key that lasts an hour, so
# no key is stored as a secret, which nuget.org discourages for automated publishing. Nothing is
# packed unless every job of the build passes, so no package is made before its games are proven on
# it.
#
# The version is build/version.sh's, the major and minor in build/version.txt and, as the patch,
# the commits since that file last changed. The package and its symbols are kept as the run's
# artifact either way, so a pack can be checked, or uploaded by hand, before one is pushed.
name: pack

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push the packages to nuget.org through its trusted publishing policy, which needs no secret'
        type: boolean
        default: false

permissions:
  contents: read

# A second pack run on a branch waits for the first rather than cancelling it, since a pack run cut
# short leaves no package and may be pushing one to nuget.org.
concurrency:
  group: pack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      pack: true

  pack:
    needs: build
    runs-on: ubuntu-24.04
    # The identity token nuget.org's trusted publishing policy is given, which the login step asks
    # for, the rest of the workflow keeping the read-only access it has.
    permissions:
      contents: read
      id-token: write
    # It took 3 minutes on the pack run of fc5fdc97, the engine built in Release, packed and its
    # contents checked, so 30 ends a push to nuget.org that stalls.
    timeout-minutes: 30
    steps:
      # The whole history, since the patch counts commits.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v6
        with:
          path: build/tools/slang
          key: slang-${{ runner.os }}-${{ hashFiles('build/fetch-slang.sh') }}

      - run: build/fetch-slang.sh

      - name: Work out the version
        id: version
        run: echo "version=$(build/version.sh)" >> "$GITHUB_OUTPUT"

      - run: build/pack.sh "${{ steps.version.outputs.version }}"

      # What the package holds, read from the .nupkg before it is offered, the engine, its
      # generator, documentation, compiled shaders, readme, license, notices and release notes,
      # and its dependencies' native libraries for each system BUILDING.md claims.
      - name: Check what the package holds
        env:
          E3D_REQUIRE_PACKAGE: '1'
        run: dotnet test 3DEngine.Tests -c Release --filter "FullyQualifiedName~PackageContentsTests"

      - uses: actions/upload-artifact@v7
        with:
          name: 3DEngine-${{ steps.version.outputs.version }}
          path: |
            build/package/*.nupkg
            build/package/*.snupkg

      # The policy on nuget.org belongs to the user EggyStudio and names this repository, pack.yml,
      # no environment, the push scope and the packages 3DEngine*. The key it answers lasts an hour,
      # so the login comes right before the push.
      - name: Log in to nuget.org through its trusted publishing policy
        if: ${{ inputs.publish }}
        id: login
        uses: NuGet/login@v1
        with:
          user: EggyStudio

      - name: Push to nuget.org
        if: ${{ inputs.publish }}
        run: dotnet nuget push "build/package/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Say what was made
        run: |
          echo "### 3DEngine ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.publish }}" = "true" ]; then
            echo "Pushed to nuget.org." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Packed and kept as this run's artifact, not pushed." >> "$GITHUB_STEP_SUMMARY"
          fi
