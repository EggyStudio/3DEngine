# Every push and pull request, and the pack run (pack.yml), which calls this with pack set.
#
# A push builds the solution and runs the tests on Linux, Windows and macOS, each drawing for real
# under the Khronos validation layer, whose errors fail the render test that caused them, and
# E3D_REQUIRE_VALIDATION makes a missing layer a failure rather than a skip. Linux and Windows draw
# on Mesa's lavapipe, a Vulkan device that runs on the CPU, from the image's packages and from Mesa's
# Windows build, and macOS on the runner's GPU through MoltenVK, and slangc is fetched so the shaders
# compile instead of the tests that need them being skipped. Windows and macOS then build Slide from
# the package, draw it, publish it native, play it through ./e3d offscreen and in a window, follow the
# README and build every step of the first game. On Linux the examples job packs the engine, checks
# the package, publishes Slide native, builds the examples, the guides' code and every game on the
# package, plays Slide and soaks it, builds the first game's steps and checks the tables against
# raylib.
#
# The pack run adds what a push leaves out: every example captured on Linux for the gallery and
# measured against raylib's program (captures), every example captured on the macOS runner's GPU
# (captures-macos), every game played, captured, soaked and resized from the package and the README
# followed on Linux (games), and the other eleven games played on Windows and macOS.
name: build

# Documents and captures are left out, apart from the README and BUILDING.md, whose steps the
# examples job follows. A later pattern overrides an earlier one, so BUILDING.md comes after the
# rule leaving out the other Markdown under .github.
on:
  push:
    paths: ['**', '!.github/**.md', '.github/BUILDING.md', '!AGENTS.md', '!games/**.md', '!.github/assets/**']
  pull_request:
    paths: ['**', '!.github/**.md', '.github/BUILDING.md', '!AGENTS.md', '!games/**.md', '!.github/assets/**']
  # On a push or a pull request the inputs context is empty, so inputs.pack reads as false there,
  # and a step or job of the pack run's alone asks for it as a boolean, never against a string.
  workflow_call:
    inputs:
      pack:
        description: 'Run what the pack run adds: the captures, the measure against raylib, and every game played on each system'
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to a branch cancels the run of the one before it, whose result nobody reads. A called
# run takes its caller's github context, so the pack run's jobs have a group of their own, and a push
# during a pack run cannot cancel its two hours, nor the pack run a push.
concurrency:
  group: build-${{ inputs.pack && 'pack-' || '' }}${{ github.ref }}
  cancel-in-progress: ${{ !inputs.pack }}

jobs:
  linux:
    # Named rather than ubuntu-latest, since lavapipe comes from the image's packages, and the label
    # moving to a new release would change it under the tests with no commit to show for it. Moving
    # to the next release is a commit of its own.
    runs-on: ubuntu-24.04
    # The job took 17 minutes on the push of fc5fdc97, and build/test.py ends the suite at its own
    # 40, so the job's 45 is reached only where a step around the suite hangs.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The pinned Slang release, cached by its version so it downloads once.
      - uses: actions/cache@v6
        with:
          path: build/tools/slang
          key: slang-${{ runner.os }}-${{ hashFiles('build/fetch-slang.sh') }}

      - run: build/fetch-slang.sh

      # The validation layer from LunarG's SDK, at the version build/fetch-validation-layer.sh pins,
      # since the image's own predates VK_KHR_line_rasterization, which lavapipe offers, and warned at
      # every device the suite opened. It is named alone in VK_LAYER_PATH, so no other copy is found.
      - uses: actions/cache@v6
        with:
          path: build/tools/vulkan-layer
          key: vulkan-layer-${{ runner.os }}-${{ hashFiles('build/fetch-validation-layer.sh') }}

      # Mesa's cache of the shaders lavapipe compiles, named in the workspace and kept from run to
      # run. lavapipe compiles a pipeline's variants as it first draws with them, and every app of the
      # suite opens a device of its own, so with no cache each app compiled them again: on a host's
      # lavapipe four apps in one process took 3.7 seconds each with Mesa's cache off and 0.84 with
      # it, a pipeline cache of the engine's own sparing none of it, since lavapipe keeps its
      # variants out of one. It is restored here and saved after the suite whatever the suite does,
      # since actions/cache saves only from a job that passed, and a push's job that failed left the
      # shaders it changed unsaved for the next run to compile again in every app.
      - uses: actions/cache/restore@v6
        with:
          path: build/mesa-cache
          key: mesa-${{ runner.os }}-${{ hashFiles('3DEngine/Shaders/**') }}
          restore-keys: mesa-${{ runner.os }}-

      - name: Install lavapipe, a Vulkan device on the CPU, and the validation layer
        run: |
          sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
          build/fetch-validation-layer.sh
          echo "VK_LAYER_PATH=$PWD/build/tools/vulkan-layer/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
          echo "MESA_SHADER_CACHE_DIR=$PWD/build/mesa-cache" >> "$GITHUB_ENV"

      - run: dotnet build 3DEngine.slnx -warnaserror

      # The commit the 5.1 package was packed from, alone, which the checkout of the last commit
      # lacks, so UpgradingTests compares the public surface with it on every push and holds
      # docs/upgrading.md to every name lost since.
      - run: git fetch --depth=1 origin b43818f94727d10b6c8019b3d89ab5703491b18f

      # build/test.py runs the suite held to a time and a memory, runs it again in parts where a
      # process is lost, and ends the log with a page of what failed, which is the job's summary and
      # its annotations. glibc is held to two arenas, since each device lavapipe opens starts threads
      # that glibc gives arenas of their own, and what is freed in an arena stays the test host's,
      # some hundred MB over the drawing tests.
      - run: python3 build/test.py --no-build
        env:
          E3D_REQUIRE_VALIDATION: '1'
          E3D_REQUIRE_VULKAN: '1'
          MALLOC_ARENA_MAX: '2'

      # The shaders the suite compiled, kept whether it passed or not.
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: build/mesa-cache
          key: mesa-${{ runner.os }}-${{ hashFiles('3DEngine/Shaders/**') }}


      # The page, from every run, for the digest job below.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-digest-linux
          path: |
            3DEngine.Tests/TestResults/digest.md
            3DEngine.Tests/TestResults/digest.json
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        # Kept for a job canceled as well as one that failed, since a cut-short run is the one to read.
        if: failure() || cancelled()
        with:
          name: test-results-linux
          path: 3DEngine.Tests/TestResults/

  windows:
    runs-on: windows-latest
    # The job took 75 minutes on the push of fc5fdc97, 46 of them the suite and 20 the twelve games,
    # so a push, which plays Slide alone, has 100, and the pack run, which plays the twelve, 180, the
    # suite held to 60 below and the games' step to 110.
    timeout-minutes: ${{ inputs.pack && 180 || 100 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v6
        with:
          path: build/tools/slang
          key: slang-${{ runner.os }}-${{ hashFiles('build/fetch-slang.ps1') }}

      - run: build/fetch-slang.ps1
        shell: pwsh

      # Mesa's cache of the shaders lavapipe compiles, restored here and saved after the suite as the
      # Linux job keeps it. The suite's apps here drew a frame in 3.8 seconds where four apps on a
      # host's lavapipe took 3.7 each with Mesa's cache off and 0.84 with it.
      - uses: actions/cache/restore@v6
        with:
          path: build/mesa-cache
          key: mesa-${{ runner.os }}-${{ hashFiles('3DEngine/Shaders/**') }}
          restore-keys: mesa-${{ runner.os }}-

      # The Vulkan loader from LunarG's runtime, the validation layer from its SDK, and lavapipe
      # from Mesa's Windows build, pointed at by the loader's variables rather than installed.
      - name: Install the Vulkan loader, the validation layer and lavapipe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/vulkan"
          cd "$RUNNER_TEMP/vulkan"
          curl -sSL -o runtime.zip "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-runtime-components.zip"
          7z x -y runtime.zip > /dev/null
          loader=$(find "$PWD" -path '*x64*' -name vulkan-1.dll | head -1)
          cp "$loader" "$GITHUB_WORKSPACE/"
          curl -sSL -o sdk.exe "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe"
          ./sdk.exe --root "C:\VulkanSDK" --accept-licenses --default-answer --confirm-command install
          gh release download --repo pal1000/mesa-dist-win --pattern '*release-msvc.7z' --output mesa.7z
          7z x -y mesa.7z -omesa > /dev/null
          icd=$(cygpath -w "$(find "$PWD/mesa/x64" -name 'lvp_icd*.json' | head -1)")
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "VK_ADD_LAYER_PATH=C:\VulkanSDK\Bin" >> "$GITHUB_ENV"
          echo "MESA_SHADER_CACHE_DIR=$(cygpath -w "$GITHUB_WORKSPACE/build/mesa-cache")" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      # The loader leaves VK_DRIVER_FILES and VK_ICD_FILENAMES unread in a process with an
      # administrator's rights, which a hosted runner's job is, and reads the drivers the registry
      # names instead, so lavapipe's manifest is named there too. The SDK's installer registers its
      # validation layer the same way.
      - name: Register lavapipe where an elevated loader reads it
        shell: pwsh
        run: |
          New-Item -Path 'HKLM:\SOFTWARE\Khronos\Vulkan\Drivers' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Khronos\Vulkan\Drivers' -Name $env:VK_DRIVER_FILES -PropertyType DWord -Value 0 -Force | Out-Null

      - run: dotnet build 3DEngine.slnx -warnaserror

      # Windows' own dump of any process that dies, a test host or a game, into the folder
      # build/test.py lists dumps from and build/drive-game.sh names a game's from, where the
      # runtime's createdump left none for a host lost at a limit. A minidump, which holds each
      # thread's stack and is read by dotnet-dump or WinDbg, named after the program's file.
      - name: Keep a dump of a process that dies
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value "$env:GITHUB_WORKSPACE\3DEngine.Tests\TestResults\dumps" -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord -Value 20 -Force | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\3DEngine.Tests\TestResults\dumps" | Out-Null

      # The suite through build/test.py, as on Linux, held to 60 minutes where the script's own
      # limit is 40, since a Mesa cache never saved after a failed job leaves every app compiling
      # the changed shaders, 3.7 seconds an app where 0.84, which doubled the suite from 22 minutes
      # past 40 on the pack run of ee85866f. A suite that runs cold then still ends whole and saves
      # the cache.
      - run: python build/test.py --no-build --timeout-minutes 60
        env:
          E3D_REQUIRE_VALIDATION: '1'
          E3D_REQUIRE_VULKAN: '1'

      # The shaders the suite compiled, kept whether it passed or not.
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: build/mesa-cache
          key: mesa-${{ runner.os }}-${{ hashFiles('3DEngine/Shaders/**') }}


      - name: Build a game from the package and draw it under the validation layer
        run: build/play-game.sh Slide

      # The same game published as native code from the package, as a player's copy is, linked by
      # the Visual Studio the runner has, and drawn under the validation layer (NORM.md, N 2.5), as
      # the build workflow's Linux job publishes it, a failure named in an error of its own.
      - name: Publish the game native from the package and draw it
        timeout-minutes: 15
        run: build/play-native.sh Slide

      # On a push Slide alone is played through ./e3d offscreen, as the Linux examples job plays it,
      # its swipe, double tap and hold asserted. Its play takes about a minute on lavapipe, its
      # twelve minutes stop it with its error saying how far it got, and the step's 15 end a wait
      # that budget does not catch.
      - name: Play the puzzle of gestures from the package through e3d
        if: ${{ !inputs.pack }}
        timeout-minutes: 15
        env:
          DRIVE_MINUTES: '12'
        run: build/drive-game.sh Slide

      # In the pack run every game from the same package is played through ./e3d, as every game is
      # on Linux, each asserting its walk or its win, so a game's input, its sound and the session
      # ./e3d drives are tried on this system too. A game that fails says why in an error of its own,
      # naming the system, and the rest are played still. Each has twelve minutes, twice Manor's walk
      # on four cores of lavapipe, past which it is stopped and its error says how far it got, so a
      # slow device names the game it is slow at, where the job's time otherwise ran out with the
      # games still playing and nothing on the page. The step has 110 minutes of the job's 180, so a
      # wait no budget catches ends the step, with the errors said so far on the page and the page's
      # artifacts uploaded, and not the job.
      - name: Play every game from the package through e3d
        if: ${{ inputs.pack }}
        timeout-minutes: 110
        env:
          DRIVE_MINUTES: '12'
        run: |
          failed=0
          for game in Hopper Summit Swarm Rally Manor Tactics Tempo Sumo Wordfall Slide Jelly Wick; do
            build/drive-game.sh "$game" || failed=1
          done
          exit $failed

      # Slide played once more in a window on the runner's desktop, as a player sees it, so SDL's
      # window and the swapchain are tried on this system and not the offscreen path alone. Its
      # play takes about a minute on lavapipe, and the step stops it at four.
      - name: Play a game in a window through e3d
        timeout-minutes: 6
        env:
          DRIVE_MINUTES: '4'
        run: build/drive-game.sh Slide window

      # The README's commands in a new project and every step of the game docs/first-game.md makes,
      # from the same package, as a newcomer on this system follows them.
      - name: Follow the README in a new project
        run: build/readme-walk.sh build/package

      - name: Build and run every step of the first game
        run: build/first-game.sh

      # The page, from every run, for the digest job below.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-digest-windows
          path: |
            3DEngine.Tests/TestResults/digest.md
            3DEngine.Tests/TestResults/digest.json
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        # Kept for a job canceled as well as one that failed, since a cut-short run is the one to read.
        if: failure() || cancelled()
        with:
          name: test-results-windows
          path: |
            3DEngine.Tests/TestResults/
            captures/

  macos:
    # Apple silicon, whose GPU MoltenVK draws on through Metal.
    runs-on: macos-15
    # The job took 40 minutes on the push of fc5fdc97, 14 of them the suite and 18 the twelve games,
    # so a push, which plays Slide alone, has 75, and the pack run, which plays the twelve, 120.
    # Every example's capture on this GPU is the pack run's, in captures-macos below.
    timeout-minutes: ${{ inputs.pack && 120 || 75 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v6
        with:
          path: build/tools/slang
          key: slang-${{ runner.os }}-${{ hashFiles('build/fetch-slang.sh') }}

      - run: build/fetch-slang.sh

      # MoltenVK, the loader and the validation layer from Homebrew, the loader found by the dynamic
      # linker's fallback path, where .NET looks for it, and MoltenVK and the layer named to it. The
      # layer's folder is the one the loader searches, in VK_LAYER_PATH, since Homebrew's loader also
      # searches Homebrew's share folder, which links the same layer, and adding the folder to its
      # search found the layer twice at every instance.
      - name: Install MoltenVK, the Vulkan loader and the validation layer
        run: |
          brew install molten-vk vulkan-loader vulkan-validationlayers
          prefix=$(brew --prefix)
          echo "DYLD_FALLBACK_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json" >> "$GITHUB_ENV"
          echo "VK_LAYER_PATH=$(brew --prefix vulkan-validationlayers)/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"

      # dotnet-gcdump, at the version tried, with which the leak tests count the heap's objects by
      # type after their twentieth app and their hundredth, since a hundred apps that draw grew the
      # heap here and nowhere else, so a failure names the types that grew.
      - name: Install dotnet-gcdump for the leak tests
        run: |
          dotnet tool install dotnet-gcdump --version 10.0.745401 --tool-path "$RUNNER_TEMP/gcdump"
          echo "E3D_GCDUMP=$RUNNER_TEMP/gcdump/dotnet-gcdump" >> "$GITHUB_ENV"

      # dotnet-dump, at the version tried, with which build/test.py reads the minidump a test host
      # that died left, here where it was made, since no other system reads a macOS dump, and puts
      # the faulting thread's stack on the page, where the dump itself is behind a sign-in.
      - name: Install dotnet-dump to read a test host's minidump
        run: |
          dotnet tool install dotnet-dump --version 10.0.750501 --tool-path "$RUNNER_TEMP/dotnet-dump"
          echo "E3D_DOTNET_DUMP=$RUNNER_TEMP/dotnet-dump/dotnet-dump" >> "$GITHUB_ENV"

      - run: dotnet build 3DEngine.slnx -warnaserror

      # The suite through build/test.py, as on Linux.
      - run: python3 build/test.py --no-build
        env:
          E3D_REQUIRE_VALIDATION: '1'
          E3D_REQUIRE_VULKAN: '1'

      - name: Build a game from the package and draw it under the validation layer
        run: build/play-game.sh Slide

      # The same game published as native code from the package, as a player's copy is, linked by
      # the Xcode the runner has, and drawn under the validation layer (NORM.md, N 2.5), as the
      # build workflow's Linux job publishes it, a failure named in an error of its own.
      - name: Publish the game native from the package and draw it
        timeout-minutes: 15
        run: build/play-native.sh Slide

      # On a push Slide alone is played through ./e3d offscreen, as on Windows, with the same
      # twelve minutes and the step's 15.
      - name: Play the puzzle of gestures from the package through e3d
        if: ${{ !inputs.pack }}
        timeout-minutes: 15
        env:
          DRIVE_MINUTES: '12'
        run: build/drive-game.sh Slide

      # In the pack run every game from the same package is played through ./e3d, as on Windows,
      # each with twelve minutes, past which it is stopped and its error says how far it got, a game
      # that fails saying why in an error of its own and the rest played still.
      - name: Play every game from the package through e3d
        if: ${{ inputs.pack }}
        env:
          DRIVE_MINUTES: '12'
        run: |
          failed=0
          for game in Hopper Summit Swarm Rally Manor Tactics Tempo Sumo Wordfall Slide Jelly Wick; do
            build/drive-game.sh "$game" || failed=1
          done
          exit $failed

      # Slide played once more in a window on the runner's desktop, as a player sees it, so SDL's
      # window and the swapchain are tried on this system and not the offscreen path alone. Its
      # play takes about a minute on lavapipe, and the step stops it at four.
      - name: Play a game in a window through e3d
        timeout-minutes: 6
        env:
          DRIVE_MINUTES: '4'
        run: build/drive-game.sh Slide window

      # The README's commands in a new project and every step of the game docs/first-game.md makes,
      # from the same package, as a newcomer on this system follows them.
      - name: Follow the README in a new project
        run: build/readme-walk.sh build/package

      - name: Build and run every step of the first game
        run: build/first-game.sh

      # The page, from every run, for the digest job below.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-digest-macos
          path: |
            3DEngine.Tests/TestResults/digest.md
            3DEngine.Tests/TestResults/digest.json
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        # Kept for a job canceled as well as one that failed, since a cut-short run is the one to read.
        if: failure() || cancelled()
        with:
          name: test-results-macos
          path: |
            3DEngine.Tests/TestResults/
            captures/

  digest:
    # One page for the commit from the three systems' pages, a line for each system and each cause
    # with the systems it was seen on, the one place that says where a commit fails.
    needs: [linux, windows, macos]
    if: always()
    runs-on: ubuntu-24.04
    # It reads three pages and writes one, which took seconds on the push of fc5fdc97.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: test-digest-*
          path: digests

      - run: python3 build/test.py --digest digests/*

  # Each step's script in the examples, captures and games jobs runs in bash as GitHub's own shell
  # runs it, through build/step.py, which gives a step that fails having said nothing an error naming
  # the step, the command that failed with its exit code, the step's last lines and the session logs'
  # last lines at a warning or worse (NORM.md, N 6.7), where a command whose answer went into a
  # variable ended the step with its code alone. The step is named from this file, since a called
  # workflow's run, the pack run's, names the caller's.
  #
  # Nothing in the Linux jobs needs a GPU or a display. lavapipe draws, so the examples and the games
  # run with --offscreen, and an error the validation layer reports fails the program whose log holds
  # it.
  examples:
    needs: linux
    runs-on: ubuntu-24.04
    # The job took 9 minutes on the push of fc5fdc97, and 90 leaves room for lavapipe compiling every
    # shader again where Mesa's cache is cold, a step that hangs ending the job there and not at
    # GitHub's six hours.
    timeout-minutes: 90
    defaults:
      run:
        shell: python3 build/step.py {0} --workflow .github/workflows/build.yml
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The pinned Slang release, cached by its version so it downloads once.
      - uses: actions/cache@v6
        with:
          path: build/tools/slang
          key: slang-${{ runner.os }}-${{ hashFiles('build/fetch-slang.sh') }}

      - run: build/fetch-slang.sh

      # The validation layer from LunarG's SDK, as the tests take it, since the image's own predates
      # VK_KHR_line_rasterization, which lavapipe offers.
      - uses: actions/cache@v6
        with:
          path: build/tools/vulkan-layer
          key: vulkan-layer-${{ runner.os }}-${{ hashFiles('build/fetch-validation-layer.sh') }}

      # Mesa's cache of the shaders lavapipe compiles, as the Linux job keeps it, since every program
      # played opens a device of its own.
      - uses: actions/cache@v6
        with:
          path: build/mesa-cache
          key: mesa-examples-${{ runner.os }}-${{ hashFiles('3DEngine/Shaders/**') }}
          restore-keys: mesa-examples-${{ runner.os }}-

      # clang and zlib's headers, which the native compiler links with.
      - name: Install lavapipe, a Vulkan device on the CPU, and the validation layer
        run: |
          sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 clang zlib1g-dev
          build/fetch-validation-layer.sh
          echo "VK_LAYER_PATH=$PWD/build/tools/vulkan-layer/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
          echo "MESA_SHADER_CACHE_DIR=$PWD/build/mesa-cache" >> "$GITHUB_ENV"

      - run: dotnet build 3DEngine.slnx

      # The package the games and the examples below are built from, as a user's game is.
      - name: Pack the engine
        run: build/pack.sh

      # What the package build/pack.sh made holds, as the pack workflow checks before offering one.
      - name: Check what the package holds
        env:
          E3D_REQUIRE_PACKAGE: '1'
        run: dotnet test 3DEngine.Tests -c Release --filter "FullyQualifiedName~PackageContentsTests"

      # The lightest of the 3D games published as native code from the package, as a player gets
      # it, which keeps only what the compiler sees used, and drawn under the validation layer
      # (NORM.md, N 2.5). The native compiler links with clang and zlib, installed above.
      - name: Publish a game native from the package and draw it
        run: build/play-native.sh Slide

      # Every example built in a project of its own on the package alone, as a reader copying one
      # into a game of their own builds it (NORM.md, N 2.7).
      - name: Build the examples on the package alone
        run: build/examples-on-package.sh

      # Every C# block of the guides under docs/ built on the same package, a fragment after the
      # lines a comment before it gives, so a block that calls what the surface no longer has fails
      # the run with its page and line (build/docs-on-package.py).
      - name: Build the guides' code on the package
        run: python3 -u build/docs-on-package.py

      # Every game built from the package, so none stops compiling against it, and the puzzle of
      # gestures played, by build/drive-game.sh as Windows and macOS play it. The games job plays
      # every game in the pack run.
      - name: Build every game from the package and play the puzzle of gestures
        run: |
          for game in Hopper Summit Swarm Rally Manor Tactics Tempo Sumo Wordfall Slide Jelly Wick; do
            dotnet restore "games/$game" --force-evaluate
            dotnet build "games/$game" --no-restore
          done
          build/drive-game.sh Slide

      # And it alone is played for two minutes while what it holds is read (build/soak.sh), failing
      # as the whole soak fails (build/soak-check.py).
      - name: Play the puzzle of gestures a while and check nothing it holds grows
        run: |
          build/soak.sh slide games/Slide/bin/Debug/net10.0/Slide 120 > captures/soak-slide.log 2>&1 || echo "the soak of Slide ended early"
          cat captures/soak-slide.log
          cp build/soak/*.csv captures/
          python3 build/soak-check.py build/soak/*.csv

      # Every step of the game docs/first-game.md makes, each a whole program, built from the same
      # package and run offscreen, so no step the page shows stops compiling.
      - name: Build and run every step of the first game
        run: build/first-game.sh

      # Every one of raylib's examples is a row of .github/EXAMPLES.md, which the script writes from
      # raylib's own list at the commit build/raylib-bench/run.sh pins (NORM.md, N 5.2). A new
      # example here, or a line of 3DEngine.Examples/triage.tsv changed, without the table written
      # again fails here. It runs last and whatever failed before it, since run first a table out of
      # date ended the job before the package's steps and the soak, whose own lines say whether they
      # pass.
      - name: Check the table of raylib's examples
        if: ${{ !cancelled() }}
        run: build/examples-table.py --check

      # Each of raylib.h's functions not carried is answered on docs/compared-with-raylib.md, by its
      # C# or its reason, and the page's counts are coverage.py's. A function carried, or one more
      # left out, without the page written again fails here, last for the same reason.
      - name: Check the comparison with raylib against its functions
        if: ${{ !cancelled() }}
        run: build/raylib-bench/coverage.py --check

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: examples-linux
          path: captures/

  # Every example captured for the gallery and measured against raylib's program, in the pack run
  # alone.
  captures:
    if: ${{ inputs.pack }}
    needs: linux
    runs-on: ubuntu-24.04
    # The captures took 23 minutes and the measure 27 on the pack run of fc5fdc97, and 150 leaves
    # room for lavapipe compiling every shader again where Mesa's cache is cold.
    timeout-minutes: 150
    defaults:
      run:
        shell: python3 build/step.py {0} --workflow .github/workflows/build.yml
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The pinned Slang release, cached by its version so it downloads once.
      - uses: actions/cache@v6
        with:
          path: build/tools/slang
          key: slang-${{ runner.os }}-${{ hashFiles('build/fetch-slang.sh') }}

      - run: build/fetch-slang.sh

      # The validation layer from LunarG's SDK, as the tests take it, since the image's own predates
      # VK_KHR_line_rasterization, which lavapipe offers.
      - uses: actions/cache@v6
        with:
          path: build/tools/vulkan-layer
          key: vulkan-layer-${{ runner.os }}-${{ hashFiles('build/fetch-validation-layer.sh') }}

      # Mesa's cache of the shaders lavapipe compiles, a key of its own beside the examples job's,
      # which it starts from the first time, since every capture opens a device of its own.
      - uses: actions/cache@v6
        with:
          path: build/mesa-cache
          key: mesa-captures-${{ runner.os }}-${{ hashFiles('3DEngine/Shaders/**') }}
          restore-keys: |
            mesa-captures-${{ runner.os }}-
            mesa-examples-${{ runner.os }}-

      # Mesa's OpenGL beside its Vulkan, which raylib's own programs draw through for the measure
      # against them, Pillow, which compares the pictures, and cwebp, which encodes the captures.
      - name: Install lavapipe, a Vulkan device on the CPU, and the validation layer
        run: |
          sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 webp libegl1 libegl-mesa0 libgl1-mesa-dri python3-pil
          build/fetch-validation-layer.sh
          echo "VK_LAYER_PATH=$PWD/build/tools/vulkan-layer/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
          echo "MESA_SHADER_CACHE_DIR=$PWD/build/mesa-cache" >> "$GITHUB_ENV"

      # The files of raylib's own that its examples load, at the commit run.sh pins.
      - run: build/fetch-raylib-resources.sh

      - run: dotnet build 3DEngine.slnx

      # Each example opened with no window, driven where it waits for input, run until its scene
      # has settled and its frame rate is measured, captured and closed (build/capture-example.sh),
      # then its session log checked for validation errors, every example captured before the step
      # fails and a capture that fails saying why in its error (build/capture-examples.sh).
      - name: Capture every example offscreen
        run: build/capture-examples.sh captures webp

      # Every written example measured against raylib's own program of its name, raylib built as
      # build/raylib-bench/run.sh builds it and its programs drawn by Mesa's OpenGL through SDL's
      # offscreen driver (build/raylib-bench/compare.py). The step fails where a pair stands more
      # than a point above the share this job's own device recorded for it in
      # 3DEngine.Examples/measured-ci.tsv, so a change cannot quietly undo a picture brought to
      # raylib's, and two machines' drivers are never compared. A pair measured for the first time
      # is listed in the run's summary and in notices, at most ten, which a reader not signed in
      # sees, to be recorded there, and until the file holds a share the step fails on none. One
      # whose picture moves by the clock or the device is left out with the reason its line in
      # triage.tsv gives.
      - name: Measure every example against raylib's program
        run: python3 -u build/raylib-bench/compare.py all --against 3DEngine.Examples/measured-ci.tsv --record captures/measured-ci.tsv

      - name: Put the shares measured in the run's summary
        if: always()
        run: |
          if [ -f captures/measured-ci.tsv ]; then
            { echo '### Shares apart from raylib, this run'; echo; echo '```'; grep -v '^#' captures/measured-ci.tsv; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: example-captures
          path: captures/

  # Every example captured on the macOS runner's GPU through MoltenVK, in the pack run alone, as the
  # Linux captures are, since the job took 53 to 58 minutes.
  captures-macos:
    if: ${{ inputs.pack }}
    needs: linux
    # A job of its own beside the tests, so the captures' time is their own and the games, the
    # window, the native publish and the walk keep theirs. The captures took 3,012 seconds inside the
    # tests' job at b526089c and were stopped there by the step's 50 minutes, so the step has 140 here
    # and the script a budget of 130, past which it names the last example reached, and each example
    # 300 seconds, past which it alone fails. The 253 took 1,481 seconds on a laptop's RTX 4070
    # (build/capture-examples.sh), and the script's notice says how many drew here and how long they
    # took.
    runs-on: macos-15
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v6
        with:
          path: build/tools/slang
          key: slang-${{ runner.os }}-${{ hashFiles('build/fetch-slang.sh') }}

      - run: build/fetch-slang.sh

      # As the macos job installs them, for the same reasons.
      - name: Install MoltenVK, the Vulkan loader and the validation layer
        run: |
          brew install molten-vk vulkan-loader vulkan-validationlayers
          prefix=$(brew --prefix)
          echo "DYLD_FALLBACK_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json" >> "$GITHUB_ENV"
          echo "VK_LAYER_PATH=$(brew --prefix vulkan-validationlayers)/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"

      # The files of raylib's own that its examples load, which a build of the examples copies
      # beside the program.
      - run: build/fetch-raylib-resources.sh

      - run: dotnet build 3DEngine.Examples -warnaserror

      # Every example captured offscreen, as the build workflow's Linux job captures them, each
      # checked to draw and its session checked for validation errors, a capture that fails
      # naming the example and why (build/capture-examples.sh). The pictures are kept as the job's
      # artifact with each one's seconds in times.tsv, and compared with nothing, since the
      # README's gallery and the measures against raylib are Linux's.
      - name: Capture every example offscreen
        timeout-minutes: 140
        env:
          CAPTURE_MINUTES: '130'
          CAPTURE_SECONDS: '300'
        run: build/capture-examples.sh captures/examples png

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: examples-macos
          path: captures/examples/
          if-no-files-found: ignore

  # Every game played from the package, captured, soaked and resized, and the README followed, in
  # the pack run alone.
  games:
    if: ${{ inputs.pack }}
    needs: linux
    runs-on: ubuntu-24.04
    # The games, the soak, the resizes and the README's walk took 28 minutes on the pack run of
    # fc5fdc97, Manor's walk the longest game at 4, and 150 leaves room for lavapipe compiling every
    # shader again where Mesa's cache is cold.
    timeout-minutes: 150
    defaults:
      run:
        shell: python3 build/step.py {0} --workflow .github/workflows/build.yml
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The pinned Slang release, cached by its version so it downloads once.
      - uses: actions/cache@v6
        with:
          path: build/tools/slang
          key: slang-${{ runner.os }}-${{ hashFiles('build/fetch-slang.sh') }}

      - run: build/fetch-slang.sh

      # The validation layer from LunarG's SDK, as the tests take it, since the image's own predates
      # VK_KHR_line_rasterization, which lavapipe offers.
      - uses: actions/cache@v6
        with:
          path: build/tools/vulkan-layer
          key: vulkan-layer-${{ runner.os }}-${{ hashFiles('build/fetch-validation-layer.sh') }}

      # Mesa's cache of the shaders lavapipe compiles, a key of its own beside the examples job's,
      # which it starts from the first time, since every game played opens a device of its own.
      - uses: actions/cache@v6
        with:
          path: build/mesa-cache
          key: mesa-games-${{ runner.os }}-${{ hashFiles('3DEngine/Shaders/**') }}
          restore-keys: |
            mesa-games-${{ runner.os }}-
            mesa-examples-${{ runner.os }}-

      # cwebp, which encodes the games' captures.
      - name: Install lavapipe, a Vulkan device on the CPU, and the validation layer
        run: |
          sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 webp
          build/fetch-validation-layer.sh
          echo "VK_LAYER_PATH=$PWD/build/tools/vulkan-layer/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
          echo "MESA_SHADER_CACHE_DIR=$PWD/build/mesa-cache" >> "$GITHUB_ENV"

      # The files of raylib's own that the examples resized below may load.
      - run: build/fetch-raylib-resources.sh

      - run: dotnet build 3DEngine.slnx

      # The package the games and the examples below are built from, as a user's game is.
      - name: Pack the engine
        run: build/pack.sh

      # The 2D game from the same package, run right and jumped with the pad's south button.
      - name: Build and play the 2D game from the package
        env:
          ENGINE_VULKAN_VALIDATION: '1'
        run: |
          dotnet restore games/Hopper --force-evaluate
          dotnet build games/Hopper --no-restore
          ./e3d open games/Hopper/bin/Debug/net10.0/Hopper --offscreen --quiet
          ./e3d command input.key Right 40 --quiet
          ./e3d command input.button 0 RightFaceDown 2 --quiet
          ./e3d command input.key Right 120 --quiet
          ./e3d shot captures/hopper.png --quiet
          build/webp.sh captures/hopper.png captures/hopper.webp lossless 800x450
          ./e3d stop --quiet
          if grep -F '[Vulkan.Validation]' build/sessions/Hopper.log | grep -F 'Validation Error'; then
            echo "::error::Hopper: the validation layer reported an error"
            exit 1
          fi

      # The 3D platformer from the same package: its level of prefabs loads, Enter starts it once
      # the level's meshes are solid, and the player runs up the steps.
      - name: Build and play the 3D platformer from the package
        env:
          ENGINE_VULKAN_VALIDATION: '1'
        run: |
          dotnet restore games/Summit --force-evaluate
          dotnet build games/Summit --no-restore
          ./e3d open games/Summit/bin/Debug/net10.0/Summit --offscreen --quiet
          ./e3d command frames.wait 60 --quiet
          ./e3d command input.key Enter 2 --quiet
          ./e3d command input.key W 120 --quiet
          ./e3d shot captures/summit.png --quiet
          build/webp.sh captures/summit.png captures/summit.webp lossy 800x450
          ./e3d stop --quiet
          if grep -F '[Vulkan.Validation]' build/sessions/Summit.log | grep -F 'Validation Error'; then
            echo "::error::Summit: the validation layer reported an error"
            exit 1
          fi

      # The game written in the ECS from the same package: Enter starts it, the first wave is
      # fought until creatures fall, its script is changed while it runs and compiled again, and
      # what a frame costs is kept beside the captures.
      - name: Build and play the arena game from the package
        env:
          ENGINE_VULKAN_VALIDATION: '1'
        run: |
          dotnet restore games/Swarm --force-evaluate
          dotnet build games/Swarm --no-restore
          ./e3d open games/Swarm/bin/Debug/net10.0/Swarm --offscreen --quiet
          ./e3d command swarm.invulnerable true --quiet
          ./e3d command input.key Enter 2 --quiet
          ./e3d command frames.wait 600 --quiet --timeout 600
          status=$(./e3d command swarm.status)
          echo "$status"
          sed -i 's/tuning.EnemySpeed = 1;/tuning.EnemySpeed = 0.5f;/' games/Swarm/source/behaviors/Tune.cs
          ./e3d command frames.wait 300 --quiet --timeout 600
          ./e3d shot captures/swarm.png --quiet
          build/webp.sh captures/swarm.png captures/swarm.webp lossy 800x450
          ./e3d command profile > captures/swarm-profile.txt
          ./e3d stop --quiet
          case "$status" in
            *"fallen 0"*|"") echo "::error::Swarm: no creature fell in the first wave"; exit 1 ;;
          esac
          if ! grep -q "Hot-reload behaviors: Compiled" build/sessions/Swarm.log; then
            echo "::error::Swarm: the script changed while it ran was not compiled again"
            exit 1
          fi
          if grep -F '[Vulkan.Validation]' build/sessions/Swarm.log | grep -F 'Validation Error'; then
            echo "::error::Swarm: the validation layer reported an error"
            exit 1
          fi

      # The racing game from the same package, whose autopilot drives a lap through every gate, so
      # the car's wheels, the triggers and the lap's count are all played, and a lap is recorded.
      - name: Build and race the rally game from the package
        env:
          ENGINE_VULKAN_VALIDATION: '1'
        run: |
          dotnet restore games/Rally --force-evaluate
          dotnet build games/Rally --no-restore
          ./e3d open games/Rally/bin/Debug/net10.0/Rally --offscreen --quiet
          ./e3d command frames.wait 60 --quiet
          ./e3d command rally.autopilot true --quiet
          ./e3d command input.key Enter 2 --quiet
          ./e3d command frames.wait 640 --quiet --timeout 600
          ./e3d shot captures/rally.png --quiet
          build/webp.sh captures/rally.png captures/rally.webp lossy 800x450
          # A lap takes about 30 seconds of the game's time, which a slow device reaches later.
          status=""
          for i in $(seq 1 20); do
            status=$(./e3d command rally.status)
            case "$status" in *"laps []"*) ./e3d command frames.wait 300 --quiet --timeout 600 ;; *) break ;; esac
          done
          echo "$status"
          ./e3d stop --quiet
          case "$status" in
            *"laps []"*|"") echo "::error::Rally: the autopilot did not finish a lap"; exit 1 ;;
          esac
          if grep -F '[Vulkan.Validation]' build/sessions/Rally.log | grep -F 'Validation Error'; then
            echo "::error::Rally: the validation layer reported an error"
            exit 1
          fi

      # The first-person walk from the same package, played with the pad alone: Settings picked
      # from the title, vertical sync turned off and kept in the settings file, back to the title,
      # and a walk begun, which the autopilot finishes through the doors, the rooms and the yard,
      # its cells streamed in and let go on the way.
      - name: Build and walk the first-person game from the package
        env:
          ENGINE_VULKAN_VALIDATION: '1'
        run: |
          dotnet restore games/Manor --force-evaluate
          dotnet build games/Manor --no-restore
          rm -f games/Manor/bin/Debug/net10.0/manor-settings.txt
          ./e3d open games/Manor/bin/Debug/net10.0/Manor --offscreen --quiet
          ./e3d command frames.wait 60 --quiet
          # Each press held a frame, since ImGui moves again along a direction held a fifth of a
          # second, which two frames pass on a runner drawing the title under five a second, and a
          # first press so moved twice went past Settings to Quit.
          pad() { ./e3d command input.button 0 "$1" 1 --quiet; ./e3d command frames.wait 4 --quiet; }
          pad LeftFaceDown; pad RightFaceDown; pad LeftFaceDown; pad LeftFaceDown; pad RightFaceDown; pad RightFaceRight; pad LeftFaceUp; pad RightFaceDown
          screen=$(./e3d command manor.status)
          case "$screen" in
            Play*) ;;
            *) echo "::error::Manor: the pad's way through Settings to a walk ended on another screen, $screen"; ./e3d stop --quiet; exit 1 ;;
          esac
          ./e3d command manor.autopilot true --quiet
          ./e3d command frames.wait 300 --quiet --timeout 600
          ./e3d shot captures/manor.png --quiet
          build/webp.sh captures/manor.png captures/manor.webp lossy 800x450
          # The walk takes about 90 seconds of the game's time, which a slow device reaches later.
          status=""
          for i in $(seq 1 40); do
            status=$(./e3d command manor.status)
            case "$status" in Finished*) break ;; *) ./e3d command frames.wait 300 --quiet --timeout 600 ;; esac
          done
          echo "$status"
          ./e3d command memory.collect
          ./e3d stop --quiet
          case "$status" in
            Finished*) ;;
            *) echo "::error::Manor: the autopilot did not find every lantern"; exit 1 ;;
          esac
          if ! grep -q "vsync = False" games/Manor/bin/Debug/net10.0/manor-settings.txt; then
            echo "::error::Manor: the setting changed with the pad was not kept in the settings file"
            exit 1
          fi
          if grep -F '[Vulkan.Validation]' build/sessions/Manor.log | grep -F 'Validation Error'; then
            echo "::error::Manor: the validation layer reported an error"
            exit 1
          fi

      # The strategy board from the same package: a unit picked and walked by clicks the mouse
      # makes through the ray picking, the whole side picked by a box dragged round it and ordered
      # across the board together, the other side hidden in fog at the start, a match saved and
      # taken up again, and the computer playing both sides to the end.
      - name: Build and play the strategy game from the package
        env:
          ENGINE_VULKAN_VALIDATION: '1'
        run: |
          dotnet restore games/Tactics --force-evaluate
          dotnet build games/Tactics --no-restore
          rm -f games/Tactics/bin/Debug/net10.0/tactics-save.json
          ./e3d open games/Tactics/bin/Debug/net10.0/Tactics --offscreen --quiet
          ./e3d command frames.wait 30 --quiet
          ./e3d command tactics.new 7 --quiet
          ./e3d command frames.wait 10 --quiet
          click() { read -r x y <<< "$(./e3d command tactics.where "$1" "$2")"; ./e3d command input.click "$x" "$y" --quiet; ./e3d command frames.wait 40 --quiet; }
          start=$(./e3d command tactics.status)
          click 0 2
          picked=$(./e3d command tactics.status)
          click 2 2
          walked=$(./e3d command tactics.status)
          ./e3d command input.key Escape 2 --quiet
          # A box from the screen corners of the tiles the blue side stands among.
          xs=(); ys=()
          for tile in "0 1" "2 1" "0 9" "2 9"; do read -r x y <<< "$(./e3d command tactics.where $tile)"; xs+=("$x"); ys+=("$y"); done
          minx=$(printf '%s\n' "${xs[@]}" | sort -n | head -1); maxx=$(printf '%s\n' "${xs[@]}" | sort -n | tail -1)
          miny=$(printf '%s\n' "${ys[@]}" | sort -n | head -1); maxy=$(printf '%s\n' "${ys[@]}" | sort -n | tail -1)
          ./e3d command input.move $((minx - 30)) $((miny - 60)) --quiet
          ./e3d command input.drag Left $((maxx - minx + 60)) $((maxy - miny + 90)) 20 5 --quiet
          ./e3d command frames.wait 5 --quiet
          boxed=$(./e3d command tactics.status)
          click 6 5
          ./e3d command frames.wait 300 --quiet --timeout 600
          ordered=$(./e3d command tactics.status)
          printf '%s\n' "$start" "$picked" "$walked" "$boxed" "$ordered"
          ./e3d command tactics.save --quiet
          ./e3d command tactics.autopilot true --quiet
          ./e3d command frames.wait 300 --quiet --timeout 600
          ./e3d shot captures/tactics.png --quiet
          build/webp.sh captures/tactics.png captures/tactics.webp lossy 800x450
          status=""
          for i in $(seq 1 40); do
            status=$(./e3d command tactics.status)
            case "$status" in Over*) break ;; *) ./e3d command frames.wait 300 --quiet --timeout 600 ;; esac
          done
          echo "$status"
          # The player's again before the match is taken up, or the computer ends the turn saved.
          ./e3d command tactics.autopilot false --quiet
          ./e3d command tactics.load --quiet
          ./e3d command frames.wait 5 --quiet
          loaded=$(./e3d command tactics.status)
          echo "$loaded"
          ./e3d stop --quiet
          case "$start" in *"in sight 0"*) ;; *) echo "::error::Tactics: the other side was not hidden in fog at the start"; exit 1 ;; esac
          case "$picked" in *"selected Archer 0,2"*) ;; *) echo "::error::Tactics: a click on a unit did not pick it"; exit 1 ;; esac
          case "$walked" in *"selected Archer 2,2"*) ;; *) echo "::error::Tactics: a click on a tile did not walk the unit there"; exit 1 ;; esac
          case "$boxed" in *"selected 5 units"*) ;; *) echo "::error::Tactics: a box dragged round the side did not pick it"; exit 1 ;; esac
          case "$ordered" in *"ready 0"*) ;; *) echo "::error::Tactics: the units picked together did not all walk"; exit 1 ;; esac
          case "$status" in Over*) ;; *) echo "::error::Tactics: the match did not end"; exit 1 ;; esac
          case "$loaded" in "Play round 1 turn Blue"*"ready 0"*) ;; *) echo "::error::Tactics: the saved match was not taken up again"; exit 1 ;; esac
          if grep -F '[Vulkan.Validation]' build/sessions/Tactics.log | grep -F 'Validation Error'; then
            echo "::error::Tactics: the validation layer reported an error"
            exit 1
          fi

      # The rhythm game from the same package, whose autopilot plays the song through on SDL's
      # dummy audio driver. The game keeps time by the music heard and not by its frames, so each
      # note is played on the frame nearest its beat and judged within its windows however fast
      # the runner draws.
      - name: Build and play the rhythm game from the package
        env:
          ENGINE_VULKAN_VALIDATION: '1'
        run: |
          dotnet restore games/Tempo --force-evaluate
          dotnet build games/Tempo --no-restore
          rm -f games/Tempo/bin/Debug/net10.0/tempo-best.txt games/Tempo/bin/Debug/net10.0/tempo-offset.txt
          ./e3d open games/Tempo/bin/Debug/net10.0/Tempo --offscreen --quiet
          ./e3d command frames.wait 30 --quiet
          ./e3d command tempo.autopilot true --quiet
          ./e3d command input.key Enter 2 --quiet
          # Captured eight seconds into the song by the music's time, which no runner's speed moves.
          for i in $(seq 1 300); do
            ./e3d command tempo.status | awk '{ exit !($1 == "Play" && $3 >= 8) }' && break
            ./e3d command frames.wait 5 --quiet --timeout 600
          done
          ./e3d shot captures/tempo.png --quiet
          build/webp.sh captures/tempo.png captures/tempo.webp lossy 800x450
          status=""
          for i in $(seq 1 60); do
            status=$(./e3d command tempo.status)
            case "$status" in Results*) break ;; *) ./e3d command frames.wait 60 --quiet --timeout 600 ;; esac
          done
          echo "$status"
          ./e3d stop --quiet
          case "$status" in
            Results*"miss 0 "*) ;;
            *) echo "::error::Tempo: the autopilot did not play every note of the song within its windows, $status"; exit 1 ;;
          esac
          if grep -F '[Vulkan.Validation]' build/sessions/Tempo.log | grep -F 'Validation Error'; then
            echo "::error::Tempo: the validation layer reported an error"
            exit 1
          fi

      # The game of two players from the same package. The second player's pad starts the match
      # and rolls its marble as the first player's key rolls theirs, both views are drawn into
      # render textures with the game's own shaders and its compute shader painting the floor, and
      # the marbles then play themselves until one has won.
      - name: Build and play the game of two players from the package
        env:
          ENGINE_VULKAN_VALIDATION: '1'
        run: |
          dotnet restore games/Sumo --force-evaluate
          dotnet build games/Sumo --no-restore
          ./e3d open games/Sumo/bin/Debug/net10.0/Sumo --offscreen --quiet
          ./e3d command frames.wait 30 --quiet
          ./e3d command input.button 1 RightFaceDown 2 --quiet
          ./e3d command frames.wait 200 --quiet --timeout 600
          before=$(./e3d command sumo.status)
          ./e3d command input.key D 15 --quiet --timeout 600
          ./e3d command input.axis 1 LeftX 1 --quiet
          ./e3d command frames.wait 15 --quiet --timeout 600
          ./e3d command input.axis 1 LeftX 0 --quiet
          after=$(./e3d command sumo.status)
          echo "$before / $after"
          ./e3d command sumo.autopilot true --quiet
          ./e3d command frames.wait 240 --quiet --timeout 600
          ./e3d shot captures/sumo.png --quiet
          build/webp.sh captures/sumo.png captures/sumo.webp lossy 800x450
          status=""
          for i in $(seq 1 60); do
            status=$(./e3d command sumo.status)
            case "$status" in Won*) break ;; *) ./e3d command frames.wait 300 --quiet --timeout 600 ;; esac
          done
          echo "$status"
          ./e3d stop --quiet
          # Whether a marble's x, y and z after the word moved more than a tenth of a unit between
          # the two, a key or a stick held 15 frames rolling it a fifth of a unit at sixty frames
          # a second and less than half the ring at the slowest frame the game steps whole.
          moved() { printf '%s\n%s\n' "$before" "$after" | awk -v word="$1" '{ for (i = 1; i <= NF; i++) if ($i == word) for (j = 1; j <= 3; j++) p[NR, j] = $(i + j) } END { for (k = 1; k <= 3; k++) { d = p[2, k] - p[1, k]; s += d * d }; exit !(sqrt(s) > 0.1) }'; }
          moved p1 && moved p2 || { echo "::error::Sumo: a key and the second pad did not roll both marbles, $before then $after"; exit 1; }
          case "$status" in
            Won*) ;;
            *) echo "::error::Sumo: the match the marbles play themselves did not end, $status"; exit 1 ;;
          esac
          if grep -F '[Vulkan.Validation]' build/sessions/Sumo.log | grep -F 'Validation Error'; then
            echo "::error::Sumo: the validation layer reported an error"
            exit 1
          fi

      # The typing game from the same package, played by build/drive-game.sh as Windows and macOS
      # play it, a dropped list of words, typed text, the clipboard and a screenshot asserted, and
      # then captured at its own size a while into a game it types itself.
      - name: Build and play the typing game from the package
        run: |
          build/drive-game.sh Wordfall
          ./e3d open games/Wordfall/bin/Debug/net10.0/Wordfall --offscreen --quiet
          ./e3d command wordfall.autopilot true --quiet
          ./e3d command input.key Enter 2 --quiet
          ./e3d command frames.wait 900 --quiet --timeout 600
          ./e3d shot captures/wordfall.png --quiet
          ./e3d stop --quiet
          build/webp.sh captures/wordfall.png captures/wordfall.webp lossy 800x450

      # The puzzle played by gestures, by build/drive-game.sh as Windows and macOS play it, a swipe,
      # a double tap and a hold made with the mouse asserted, and then captured at its own size a
      # while into a game it plays itself.
      - name: Build and play the puzzle of gestures from the package
        run: |
          build/drive-game.sh Slide
          ./e3d open games/Slide/bin/Debug/net10.0/Slide --offscreen --quiet
          ./e3d command slide.autopilot true --quiet
          ./e3d command input.key Enter 2 --quiet
          ./e3d command frames.wait 400 --quiet --timeout 600
          ./e3d command slide.autopilot false --quiet
          ./e3d command frames.wait 10 --quiet --timeout 600
          ./e3d shot captures/slide.png --quiet
          ./e3d stop --quiet
          # The window is four by three, so the picture keeps its top, where the score is, and loses
          # the line of help at its foot.
          build/webp.sh captures/slide.png captures/slide.webp lossy 800x450 north

      # The runner, by build/drive-game.sh as Windows and macOS play it, its run watched again from
      # its recorded input and its best run watched from its file in the game opened again, each
      # asserted to end where the run did, and then captured a while into a run it makes itself.
      - name: Build and play the runner from the package
        run: |
          build/drive-game.sh Jelly
          ./e3d open games/Jelly/bin/Debug/net10.0/Jelly --offscreen --quiet
          ./e3d command jelly.autopilot true --quiet
          ./e3d command input.key Enter 2 --quiet
          ./e3d command frames.wait 600 --quiet --timeout 600
          ./e3d shot captures/jelly.png --quiet
          ./e3d stop --quiet
          build/webp.sh captures/jelly.png captures/jelly.webp lossy 800x450

      # The house lit by a lamp, by build/drive-game.sh as Windows and macOS play it, its walk and
      # the autopilot's way out asserted, and then captured with the lamp in a doorway, the room
      # beyond lit by light that bounced there.
      - name: Build and play the house of light that bounces from the package
        run: |
          build/drive-game.sh Wick
          ./e3d open games/Wick/bin/Debug/net10.0/Wick --offscreen --quiet
          ./e3d command wick.warp 12.4 4 --quiet
          ./e3d command frames.wait 120 --quiet --timeout 600
          ./e3d shot captures/wick.png --quiet
          ./e3d stop --quiet
          build/webp.sh captures/wick.png captures/wick.webp lossy 800x450

      # Each game played for two minutes at once, restarting and spawning as it goes, while what
      # it holds is read every ten seconds (build/soak.sh), failing when any of it climbs without
      # leveling off, as a leak does, or a game cannot be played through (build/soak-check.py), which
      # names the game, what climbed with its numbers or the command that ended it, and its log's
      # last warnings.
      - name: Play each game a while and check nothing it holds grows
        run: |
          games=(Hopper Summit Swarm Rally Manor Tactics Tempo Sumo Wordfall Slide Jelly Wick)
          pids=()
          for game in "${games[@]}"; do
            build/soak.sh "${game,,}" "games/$game/bin/Debug/net10.0/$game" 120 > "captures/soak-${game,,}.log" 2>&1 &
            pids+=($!)
          done
          for i in "${!pids[@]}"; do wait "${pids[$i]}" || echo "the soak of ${games[$i]} ended early"; done
          cat captures/soak-*.log
          cp build/soak/*.csv captures/
          python3 build/soak-check.py build/soak/*.csv

      # Each game and a handful of examples resized, minimized and restored while they draw, under
      # the validation layer, then captured at the size last asked for (build/storm.sh).
      - name: Resize each game and some examples while they draw
        run: |
          failed=0
          for program in games/Hopper/bin/Debug/net10.0/Hopper games/Summit/bin/Debug/net10.0/Summit \
                         games/Swarm/bin/Debug/net10.0/Swarm games/Rally/bin/Debug/net10.0/Rally \
                         games/Manor/bin/Debug/net10.0/Manor games/Tactics/bin/Debug/net10.0/Tactics \
                         games/Tempo/bin/Debug/net10.0/Tempo games/Sumo/bin/Debug/net10.0/Sumo \
                         games/Wordfall/bin/Debug/net10.0/Wordfall games/Slide/bin/Debug/net10.0/Slide \
                         games/Jelly/bin/Debug/net10.0/Jelly games/Wick/bin/Debug/net10.0/Wick \
                         shaders_bloom models_reflection_probe textures_render_target gui_imgui_window shaders_particles; do
            build/storm.sh "$program" "captures/storm-$(basename "$program").png" || { echo "::error::$program: a resize storm failed"; failed=1; }
          done
          exit $failed

      # The documents' steps in new folders, from the same packages, as someone holding only the
      # packages would follow them. The README's commands make a game from each template, and
      # BUILDING.md's nuget.config and add-package line take the README's first program, and each
      # is built and run offscreen.
      - name: Follow the README in a new project
        run: build/readme-walk.sh build/package "$RUNNER_TEMP/readme"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: game-captures
          path: captures/
