# Builds the solution, runs the tests and captures every example on every push and pull request.
#
# Nothing here needs a GPU or a display. Mesa's lavapipe is a Vulkan device that runs on the CPU,
# so the render tests draw for real and the examples run with --offscreen, and slangc is fetched
# so the shaders compile instead of the tests that need them being skipped. The Khronos validation
# layer runs under both, since a Debug build enables it when it is installed, and an error it
# reports fails the render test or the example that caused it.
name: build

# The README is not ignored, since the walk below follows its steps.
on:
  push:
    paths-ignore: ['.github/**.md', '.claude/**', 'CLAUDE.md', 'games/**.md', '.github/assets/**']
  pull_request:
    paths-ignore: ['.github/**.md', '.claude/**', 'CLAUDE.md', 'games/**.md', '.github/assets/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The pinned Slang release, cached by its version so it downloads once.
      - uses: actions/cache@v4
        with:
          path: build/tools/slang
          key: slang-${{ runner.os }}-${{ hashFiles('build/fetch-slang.sh') }}

      - run: build/fetch-slang.sh

      - name: Install lavapipe, a Vulkan device on the CPU, and the validation layer
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-validationlayers

      - run: dotnet build 3DEngine.slnx

      - run: dotnet test 3DEngine.Tests --no-build --logger "trx;LogFileName=results.trx"
        env:
          E3D_REQUIRE_VALIDATION: '1'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: 3DEngine.Tests/TestResults/

      # Each example opened with no window, captured once it is up, and closed, then its session
      # log checked for validation errors, which counts the teardown too. Every example is
      # captured before the step fails.
      - name: Capture every example offscreen
        run: |
          mkdir -p captures
          failed=0
          for example in $(grep -oP '^\s*\["\K[a-z0-9_]+' 3DEngine.Examples/Program.cs); do
            ./e3d open "$example" --offscreen --quiet
            ./e3d shot "captures/$example.png" --quiet
            ./e3d stop --quiet
            if grep -F '[Vulkan.Validation]' "build/sessions/$example.log" | grep -F 'Validation Error'; then
              echo "::error::$example: the validation layer reported an error"
              failed=1
            fi
          done
          exit $failed

      # The game under games/, built from the package as a user's is, then played offscreen. It
      # opens on the menu, Enter starts it, the player walks toward the goal, and the frame is
      # captured, its log checked as the examples' are.
      - name: Build and play the game from the package
        run: |
          build/pack.sh
          dotnet restore games/Pusher --force-evaluate
          dotnet build games/Pusher --no-restore
          ./e3d open games/Pusher/bin/Debug/net10.0/Pusher --offscreen --quiet
          ./e3d command input.key Enter 2 --quiet
          ./e3d command input.key W 90 --quiet
          ./e3d shot captures/pusher.png --quiet
          ./e3d stop --quiet
          if grep -F '[Vulkan.Validation]' build/sessions/Pusher.log | grep -F 'Validation Error'; then
            echo "::error::Pusher: the validation layer reported an error"
            exit 1
          fi

      # The 2D game from the same package, run right and jumped with the pad's south button.
      - name: Build and play the 2D game from the package
        run: |
          dotnet restore games/Hopper --force-evaluate
          dotnet build games/Hopper --no-restore
          ./e3d open games/Hopper/bin/Debug/net10.0/Hopper --offscreen --quiet
          ./e3d command input.key Right 40 --quiet
          ./e3d command input.button 0 South 2 --quiet
          ./e3d command input.key Right 120 --quiet
          ./e3d shot captures/hopper.png --quiet
          ./e3d stop --quiet
          if grep -F '[Vulkan.Validation]' build/sessions/Hopper.log | grep -F 'Validation Error'; then
            echo "::error::Hopper: the validation layer reported an error"
            exit 1
          fi

      # The README's steps in a new folder, from the same package, as someone holding only the
      # package would follow them. Its nuget.config, its add-package line and its first program are
      # built and run offscreen.
      - name: Follow the README in a new project
        run: build/readme-walk.sh build/package "$RUNNER_TEMP/readme"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: example-captures
          path: captures/

  # The engine's other desktop platform. A Windows runner has no Vulkan device, so the render and
  # capture tests skip themselves with the reason, and this job finds path separators, line
  # endings and native library names in everything else.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v4
        with:
          path: build/tools/slang
          key: slang-${{ runner.os }}-${{ hashFiles('build/fetch-slang.ps1') }}

      - run: build/fetch-slang.ps1
        shell: pwsh

      - run: dotnet build 3DEngine.slnx

      - run: dotnet test 3DEngine.Tests --no-build --logger "trx;LogFileName=results.trx"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-windows
          path: 3DEngine.Tests/TestResults/

