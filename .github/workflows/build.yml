# Builds the solution, runs the tests and captures every example on every push and pull request.
#
# Nothing here needs a GPU or a display. Mesa's lavapipe is a Vulkan device that runs on the CPU,
# so the render tests draw for real and the examples run with --offscreen, and slangc is fetched
# so the shaders compile instead of the tests that need them being skipped. The Khronos validation
# layer runs under both, since a Debug build enables it when it is installed, and an error it
# reports fails the render test or the example that caused it.
name: build

on:
  push:
    paths-ignore: ['**.md', '.github/assets/**']
  pull_request:
    paths-ignore: ['**.md', '.github/assets/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The pinned Slang release, cached by its version so it downloads once.
      - uses: actions/cache@v4
        with:
          path: build/tools/slang
          key: slang-${{ runner.os }}-${{ hashFiles('build/fetch-slang.sh') }}

      - run: build/fetch-slang.sh

      - name: Install lavapipe, a Vulkan device on the CPU, and the validation layer
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-validationlayers

      - run: dotnet build 3DEngine.slnx

      - run: dotnet test 3DEngine.Tests --no-build --logger "trx;LogFileName=results.trx"
        env:
          E3D_REQUIRE_VALIDATION: '1'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: 3DEngine.Tests/TestResults/

      # Each example opened with no window, captured once it is up, and closed, then its session
      # log checked for validation errors, which counts the teardown too. Every example is
      # captured before the step fails.
      - name: Capture every example offscreen
        run: |
          mkdir -p captures
          failed=0
          for example in $(grep -oP '^\s*\["\K[a-z0-9_]+' 3DEngine.Examples/Program.cs); do
            ./e3d open "$example" --offscreen --quiet
            ./e3d shot "captures/$example.png" --quiet
            ./e3d stop --quiet
            if grep -F '[Vulkan.Validation]' "build/sessions/$example.log" | grep -F 'Validation Error'; then
              echo "::error::$example: the validation layer reported an error"
              failed=1
            fi
          done
          exit $failed

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: example-captures
          path: captures/
