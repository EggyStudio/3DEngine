# Tests every push and pull request on Linux and Windows (test.yml), then, on Linux, captures every
# example offscreen, builds and plays the games from the package, and follows the README.
#
# Nothing here needs a GPU or a display. Mesa's lavapipe is a Vulkan device that runs on the CPU,
# so the examples run with --offscreen, and slangc is fetched so the shaders compile. The Khronos
# validation layer runs under them, and an error it reports fails the example whose log holds it.
name: build

# Documents and captures are left out, apart from the README and BUILDING.md, whose steps the walk
# below follows. A later pattern overrides an earlier one, so BUILDING.md comes after the rule
# leaving out the other Markdown under .github.
on:
  push:
    paths: ['**', '!.github/**.md', '.github/BUILDING.md', '!.claude/**', '!AGENTS.md', '!games/**.md', '!.github/assets/**']
  pull_request:
    paths: ['**', '!.github/**.md', '.github/BUILDING.md', '!.claude/**', '!AGENTS.md', '!games/**.md', '!.github/assets/**']

jobs:
  test:
    uses: ./.github/workflows/test.yml

  examples:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The pinned Slang release, cached by its version so it downloads once.
      - uses: actions/cache@v6
        with:
          path: build/tools/slang
          key: slang-${{ runner.os }}-${{ hashFiles('build/fetch-slang.sh') }}

      - run: build/fetch-slang.sh

      - name: Install lavapipe, a Vulkan device on the CPU, and the validation layer
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-validationlayers webp

      - run: dotnet build 3DEngine.slnx

      # Each example opened with no window, driven where it waits for input, run until its scene
      # has settled and its frame rate is measured, captured and closed (build/capture-example.sh),
      # then its session log checked for validation errors, which counts the teardown too. Every
      # example is captured before the step fails.
      - name: Capture every example offscreen
        run: |
          mkdir -p captures
          failed=0
          for example in $(grep -oP '^\s*\["\K[a-z0-9_]+' 3DEngine.Examples/Program.cs); do
            if ! build/capture-example.sh "$example" "captures/$example.webp"; then
              echo "::error::$example: the capture failed"
              failed=1
              ./e3d stop --quiet || true
            fi
            if grep -F '[Vulkan.Validation]' "build/sessions/$example.log" | grep -F 'Validation Error'; then
              echo "::error::$example: the validation layer reported an error"
              failed=1
            fi
          done
          exit $failed

      # The game under games/, built from the package as a user's is, then played offscreen. It
      # opens on the menu, Enter starts it, the player walks toward the goal, and the frame is
      # captured, its log checked as the examples' are. The package is a Release build, which turns
      # the validation layer on only when asked, so the check has the layer to read.
      - name: Build and play the game from the package
        env:
          ENGINE_VULKAN_VALIDATION: '1'
        run: |
          build/pack.sh
          dotnet restore games/Pusher --force-evaluate
          dotnet build games/Pusher --no-restore
          ./e3d open games/Pusher/bin/Debug/net10.0/Pusher --offscreen --quiet
          ./e3d command input.key Enter 2 --quiet
          ./e3d command input.key W 90 --quiet
          ./e3d shot captures/pusher.png --quiet
          build/webp.sh captures/pusher.png captures/pusher.webp lossy
          ./e3d stop --quiet
          if grep -F '[Vulkan.Validation]' build/sessions/Pusher.log | grep -F 'Validation Error'; then
            echo "::error::Pusher: the validation layer reported an error"
            exit 1
          fi

      # The 2D game from the same package, run right and jumped with the pad's south button.
      - name: Build and play the 2D game from the package
        env:
          ENGINE_VULKAN_VALIDATION: '1'
        run: |
          dotnet restore games/Hopper --force-evaluate
          dotnet build games/Hopper --no-restore
          ./e3d open games/Hopper/bin/Debug/net10.0/Hopper --offscreen --quiet
          ./e3d command input.key Right 40 --quiet
          ./e3d command input.button 0 South 2 --quiet
          ./e3d command input.key Right 120 --quiet
          ./e3d shot captures/hopper.png --quiet
          build/webp.sh captures/hopper.png captures/hopper.webp lossless
          ./e3d stop --quiet
          if grep -F '[Vulkan.Validation]' build/sessions/Hopper.log | grep -F 'Validation Error'; then
            echo "::error::Hopper: the validation layer reported an error"
            exit 1
          fi

      # The 3D platformer from the same package: its level of prefabs loads, Enter starts it once
      # the level's meshes are solid, and the player runs up the steps.
      - name: Build and play the 3D platformer from the package
        env:
          ENGINE_VULKAN_VALIDATION: '1'
        run: |
          dotnet restore games/Summit --force-evaluate
          dotnet build games/Summit --no-restore
          ./e3d open games/Summit/bin/Debug/net10.0/Summit --offscreen --quiet
          ./e3d command frames.wait 60 --quiet
          ./e3d command input.key Enter 2 --quiet
          ./e3d command input.key W 120 --quiet
          ./e3d shot captures/summit.png --quiet
          build/webp.sh captures/summit.png captures/summit.webp lossy
          ./e3d stop --quiet
          if grep -F '[Vulkan.Validation]' build/sessions/Summit.log | grep -F 'Validation Error'; then
            echo "::error::Summit: the validation layer reported an error"
            exit 1
          fi

      # The game written in the ECS from the same package: Enter starts it, the first wave is
      # fought until creatures fall, its script is changed while it runs and compiled again, and
      # what a frame costs is kept beside the captures.
      - name: Build and play the arena game from the package
        env:
          ENGINE_VULKAN_VALIDATION: '1'
        run: |
          dotnet restore games/Swarm --force-evaluate
          dotnet build games/Swarm --no-restore
          ./e3d open games/Swarm/bin/Debug/net10.0/Swarm --offscreen --quiet
          ./e3d command swarm.invulnerable true --quiet
          ./e3d command input.key Enter 2 --quiet
          ./e3d command frames.wait 600 --quiet --timeout 600
          status=$(./e3d command swarm.status)
          echo "$status"
          sed -i 's/tuning.EnemySpeed = 1;/tuning.EnemySpeed = 0.5f;/' games/Swarm/source/behaviors/Tune.cs
          ./e3d command frames.wait 300 --quiet --timeout 600
          ./e3d shot captures/swarm.png --quiet
          build/webp.sh captures/swarm.png captures/swarm.webp lossy
          ./e3d command profile > captures/swarm-profile.txt
          ./e3d stop --quiet
          case "$status" in
            *"fallen 0"*|"") echo "::error::Swarm: no creature fell in the first wave"; exit 1 ;;
          esac
          if ! grep -q "Hot-reload behaviors: Compiled" build/sessions/Swarm.log; then
            echo "::error::Swarm: the script changed while it ran was not compiled again"
            exit 1
          fi
          if grep -F '[Vulkan.Validation]' build/sessions/Swarm.log | grep -F 'Validation Error'; then
            echo "::error::Swarm: the validation layer reported an error"
            exit 1
          fi

      # Each game played for two minutes at once, restarting and spawning as it goes, while what
      # it holds is read every ten seconds (build/soak.sh), failing when any of it climbs without
      # leveling off (build/soak-check.py), as a leak does.
      - name: Play each game a while and check nothing it holds grows
        run: |
          pids=()
          for game in Pusher Hopper Summit Swarm; do
            build/soak.sh "${game,,}" "games/$game/bin/Debug/net10.0/$game" 120 > "captures/soak-${game,,}.log" 2>&1 &
            pids+=($!)
          done
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          cat captures/soak-*.log
          cp build/soak/*.csv captures/
          python3 build/soak-check.py build/soak/*.csv || failed=1
          if [ "$failed" = 1 ]; then echo "::error::a game grew, or could not be played, over two minutes"; exit 1; fi

      # The documents' steps in a new folder, from the same package, as someone holding only the
      # package would follow them. BUILDING.md's nuget.config and add-package line and the README's
      # first program are built and run offscreen.
      - name: Follow the README in a new project
        run: build/readme-walk.sh build/package "$RUNNER_TEMP/readme"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: example-captures
          path: captures/
