# Tests every push and pull request on Linux, Windows and macOS (test.yml), then, on Linux, builds
# the examples and the games on the package, plays and soaks one game, and checks the tables
# against raylib (examples.yml). The captures, the measure against raylib and every game played,
# soaked and resized are the pack run's (pack.yml).
name: build

# Documents and captures are left out, apart from the README and BUILDING.md, whose steps the
# examples job follows. A later pattern overrides an earlier one, so BUILDING.md comes after the
# rule leaving out the other Markdown under .github.
on:
  push:
    paths: ['**', '!.github/**.md', '.github/BUILDING.md', '!AGENTS.md', '!games/**.md', '!.github/assets/**']
  pull_request:
    paths: ['**', '!.github/**.md', '.github/BUILDING.md', '!AGENTS.md', '!games/**.md', '!.github/assets/**']

jobs:
  test:
    uses: ./.github/workflows/test.yml

  # The examples on the package as a push needs them (examples.yml), the captures, the measure
  # against raylib and the games played, soaked and resized whole left to the pack run.
  examples:
    needs: test
    uses: ./.github/workflows/examples.yml
    with:
      whole: false
