# Builds the solution and runs the tests on Linux, Windows and macOS, for the workflows that call
# it: build.yml on every push, and pack.yml before it packs, so a package is made only from a commit
# that passes on all three.
#
# Each draws for real, with the Khronos validation layer, whose errors fail the render test that
# caused them, and E3D_REQUIRE_VALIDATION makes a missing layer a failure rather than a skip. Linux
# and Windows draw on Mesa's lavapipe, a Vulkan device that runs on the CPU, from the image's
# packages and from Mesa's Windows build, and macOS on the runner's GPU through MoltenVK. Each then
# builds a game from the package and draws 300 frames of it under the validation layer, and slangc
# is fetched so the shaders compile instead of the tests that need them being skipped.
name: test

on:
  workflow_call:

jobs:
  linux:
    # Named rather than ubuntu-latest, since lavapipe comes from the image's packages, and the label
    # moving to a new release would change it under the tests with no commit to show for it. Moving
    # to the next release is a commit of its own.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The pinned Slang release, cached by its version so it downloads once.
      - uses: actions/cache@v6
        with:
          path: build/tools/slang
          key: slang-${{ runner.os }}-${{ hashFiles('build/fetch-slang.sh') }}

      - run: build/fetch-slang.sh

      # The validation layer from LunarG's SDK, at the version build/fetch-validation-layer.sh pins,
      # since the image's own predates VK_KHR_line_rasterization, which lavapipe offers, and warned at
      # every device the suite opened. It is named alone in VK_LAYER_PATH, so no other copy is found.
      - uses: actions/cache@v6
        with:
          path: build/tools/vulkan-layer
          key: vulkan-layer-${{ runner.os }}-${{ hashFiles('build/fetch-validation-layer.sh') }}

      - name: Install lavapipe, a Vulkan device on the CPU, and the validation layer
        run: |
          sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
          build/fetch-validation-layer.sh
          echo "VK_LAYER_PATH=$PWD/build/tools/vulkan-layer/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"

      - run: dotnet build 3DEngine.slnx -warnaserror

      # The commit the 5.1 package was packed from, alone, which the checkout of the last commit
      # lacks, so UpgradingTests compares the public surface with it on every push and holds
      # docs/upgrading.md to every name lost since.
      - run: git fetch --depth=1 origin b43818f94727d10b6c8019b3d89ab5703491b18f

      # build/test.py runs the suite held to a time and a memory, runs it again in parts where a
      # process is lost, and ends the log with a page of what failed, which is the job's summary and
      # its annotations. glibc is held to two arenas, since each device lavapipe opens starts threads
      # that glibc gives arenas of their own, and what is freed in an arena stays the test host's,
      # some hundred MB over the drawing tests.
      - run: python3 build/test.py --no-build
        env:
          E3D_REQUIRE_VALIDATION: '1'
          E3D_REQUIRE_VULKAN: '1'
          MALLOC_ARENA_MAX: '2'


      # The page, from every run, for the digest job below.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-digest-linux
          path: |
            3DEngine.Tests/TestResults/digest.md
            3DEngine.Tests/TestResults/digest.json
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        # Kept for a job cancelled as well as one that failed, since a cut-short run is the one to read.
        if: failure() || cancelled()
        with:
          name: test-results-linux
          path: 3DEngine.Tests/TestResults/

  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v6
        with:
          path: build/tools/slang
          key: slang-${{ runner.os }}-${{ hashFiles('build/fetch-slang.ps1') }}

      - run: build/fetch-slang.ps1
        shell: pwsh

      # The Vulkan loader from LunarG's runtime, the validation layer from its SDK, and lavapipe
      # from Mesa's Windows build, pointed at by the loader's variables rather than installed.
      - name: Install the Vulkan loader, the validation layer and lavapipe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/vulkan"
          cd "$RUNNER_TEMP/vulkan"
          curl -sSL -o runtime.zip "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-runtime-components.zip"
          7z x -y runtime.zip > /dev/null
          loader=$(find "$PWD" -path '*x64*' -name vulkan-1.dll | head -1)
          cp "$loader" "$GITHUB_WORKSPACE/"
          curl -sSL -o sdk.exe "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe"
          ./sdk.exe --root "C:\VulkanSDK" --accept-licenses --default-answer --confirm-command install
          gh release download --repo pal1000/mesa-dist-win --pattern '*release-msvc.7z' --output mesa.7z
          7z x -y mesa.7z -omesa > /dev/null
          icd=$(cygpath -w "$(find "$PWD/mesa/x64" -name 'lvp_icd*.json' | head -1)")
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "VK_ADD_LAYER_PATH=C:\VulkanSDK\Bin" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      # The loader leaves VK_DRIVER_FILES and VK_ICD_FILENAMES unread in a process with an
      # administrator's rights, which a hosted runner's job is, and reads the drivers the registry
      # names instead, so lavapipe's manifest is named there too. The SDK's installer registers its
      # validation layer the same way.
      - name: Register lavapipe where an elevated loader reads it
        shell: pwsh
        run: |
          New-Item -Path 'HKLM:\SOFTWARE\Khronos\Vulkan\Drivers' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Khronos\Vulkan\Drivers' -Name $env:VK_DRIVER_FILES -PropertyType DWord -Value 0 -Force | Out-Null

      - run: dotnet build 3DEngine.slnx -warnaserror

      # The suite through build/test.py, as on Linux.
      - run: python build/test.py --no-build
        env:
          E3D_REQUIRE_VALIDATION: '1'
          E3D_REQUIRE_VULKAN: '1'


      - name: Build a game from the package and draw it under the validation layer
        run: build/play-game.sh Pusher

      # Every game from the same package played through ./e3d, as every game is on Linux, each
      # asserting its walk or its win, so a game's input, its sound and the session ./e3d drives are
      # tried on this system too. A game that fails says why in an error of its own, naming the
      # system, and the rest are played still.
      - name: Play every game from the package through e3d
        run: |
          failed=0
          for game in Pusher Hopper Summit Swarm Rally Manor Tactics Tempo Sumo Wordfall Slide; do
            build/drive-game.sh "$game" || failed=1
          done
          exit $failed

      # The README's commands in a new project and every step of the game docs/first-game.md makes,
      # from the same package, as a newcomer on this system follows them.
      - name: Follow the README in a new project
        run: build/readme-walk.sh build/package

      - name: Build and run every step of the first game
        run: build/first-game.sh

      # The page, from every run, for the digest job below.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-digest-windows
          path: |
            3DEngine.Tests/TestResults/digest.md
            3DEngine.Tests/TestResults/digest.json
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        # Kept for a job cancelled as well as one that failed, since a cut-short run is the one to read.
        if: failure() || cancelled()
        with:
          name: test-results-windows
          path: |
            3DEngine.Tests/TestResults/
            captures/

  macos:
    # Apple silicon, whose GPU MoltenVK draws on through Metal.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v6
        with:
          path: build/tools/slang
          key: slang-${{ runner.os }}-${{ hashFiles('build/fetch-slang.sh') }}

      - run: build/fetch-slang.sh

      # MoltenVK, the loader and the validation layer from Homebrew, the loader found by the dynamic
      # linker's fallback path, where .NET looks for it, and MoltenVK and the layer named to it. The
      # layer's folder is the one the loader searches, in VK_LAYER_PATH, since Homebrew's loader also
      # searches Homebrew's share folder, which links the same layer, and adding the folder to its
      # search found the layer twice at every instance.
      - name: Install MoltenVK, the Vulkan loader and the validation layer
        run: |
          brew install molten-vk vulkan-loader vulkan-validationlayers
          prefix=$(brew --prefix)
          echo "DYLD_FALLBACK_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json" >> "$GITHUB_ENV"
          echo "VK_LAYER_PATH=$(brew --prefix vulkan-validationlayers)/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"

      # dotnet-gcdump, at the version tried, with which the leak tests count the heap's objects by
      # type after their twentieth app and their hundredth, since a hundred apps that draw grew the
      # heap here and nowhere else, so a failure names the types that grew.
      - name: Install dotnet-gcdump for the leak tests
        run: |
          dotnet tool install dotnet-gcdump --version 10.0.745401 --tool-path "$RUNNER_TEMP/gcdump"
          echo "E3D_GCDUMP=$RUNNER_TEMP/gcdump/dotnet-gcdump" >> "$GITHUB_ENV"

      - run: dotnet build 3DEngine.slnx -warnaserror

      # The suite through build/test.py, as on Linux.
      - run: python3 build/test.py --no-build
        env:
          E3D_REQUIRE_VALIDATION: '1'
          E3D_REQUIRE_VULKAN: '1'


      - name: Build a game from the package and draw it under the validation layer
        run: build/play-game.sh Pusher

      # Every game from the same package played through ./e3d, as every game is on Linux, each
      # asserting its walk or its win, so a game's input, its sound and the session ./e3d drives are
      # tried on this system too. A game that fails says why in an error of its own, naming the
      # system, and the rest are played still.
      - name: Play every game from the package through e3d
        run: |
          failed=0
          for game in Pusher Hopper Summit Swarm Rally Manor Tactics Tempo Sumo Wordfall Slide; do
            build/drive-game.sh "$game" || failed=1
          done
          exit $failed

      # The README's commands in a new project and every step of the game docs/first-game.md makes,
      # from the same package, as a newcomer on this system follows them.
      - name: Follow the README in a new project
        run: build/readme-walk.sh build/package

      - name: Build and run every step of the first game
        run: build/first-game.sh

      # The page, from every run, for the digest job below.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-digest-macos
          path: |
            3DEngine.Tests/TestResults/digest.md
            3DEngine.Tests/TestResults/digest.json
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        # Kept for a job cancelled as well as one that failed, since a cut-short run is the one to read.
        if: failure() || cancelled()
        with:
          name: test-results-macos
          path: |
            3DEngine.Tests/TestResults/
            captures/

  digest:
    # One page for the commit from the three systems' pages, a line for each system and each cause
    # with the systems it was seen on, the one place that says where a commit fails.
    needs: [linux, windows, macos]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: test-digest-*
          path: digests

      - run: python3 build/test.py --digest digests/*
