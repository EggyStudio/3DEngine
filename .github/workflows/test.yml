# Builds the solution and runs the tests on Linux, Windows and macOS, for the workflows that call
# it: build.yml on every push, and pack.yml before it packs, so a package is made only from a commit
# that passes on all three.
#
# Each draws for real, with the Khronos validation layer, whose errors fail the render test that
# caused them, and E3D_REQUIRE_VALIDATION makes a missing layer a failure rather than a skip. Linux
# and Windows draw on Mesa's lavapipe, a Vulkan device that runs on the CPU, from the image's
# packages and from Mesa's Windows build, and macOS on the runner's GPU through MoltenVK. Each then
# builds a game from the package and draws 300 frames of it under the validation layer, and slangc
# is fetched so the shaders compile instead of the tests that need them being skipped.
name: test

on:
  workflow_call:

jobs:
  linux:
    # Named rather than ubuntu-latest, since lavapipe and the validation layer come from the
    # image's packages, and the label moving to a new release would change them under the tests
    # with no commit to show for it. Moving to the next release is a commit of its own.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The pinned Slang release, cached by its version so it downloads once.
      - uses: actions/cache@v6
        with:
          path: build/tools/slang
          key: slang-${{ runner.os }}-${{ hashFiles('build/fetch-slang.sh') }}

      - run: build/fetch-slang.sh

      - name: Install lavapipe, a Vulkan device on the CPU, and the validation layer
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-validationlayers

      - run: dotnet build 3DEngine.slnx -warnaserror

      - run: dotnet test 3DEngine.Tests --no-build --logger "trx;LogFileName=results.trx"
        env:
          E3D_REQUIRE_VALIDATION: '1'
          E3D_REQUIRE_VULKAN: '1'

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-linux
          path: 3DEngine.Tests/TestResults/

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v6
        with:
          path: build/tools/slang
          key: slang-${{ runner.os }}-${{ hashFiles('build/fetch-slang.ps1') }}

      - run: build/fetch-slang.ps1
        shell: pwsh

      # The Vulkan loader from LunarG's runtime, the validation layer from its SDK, and lavapipe
      # from Mesa's Windows build, pointed at by the loader's variables rather than installed.
      - name: Install the Vulkan loader, the validation layer and lavapipe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/vulkan"
          cd "$RUNNER_TEMP/vulkan"
          curl -sSL -o runtime.zip "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-runtime-components.zip"
          7z x -y runtime.zip > /dev/null
          loader=$(find "$PWD" -path '*x64*' -name vulkan-1.dll | head -1)
          cp "$loader" "$GITHUB_WORKSPACE/"
          curl -sSL -o sdk.exe "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe"
          ./sdk.exe --root "C:\VulkanSDK" --accept-licenses --default-answer --confirm-command install
          gh release download --repo pal1000/mesa-dist-win --pattern '*release-msvc.7z' --output mesa.7z
          7z x -y mesa.7z -omesa > /dev/null
          icd=$(cygpath -w "$(find "$PWD/mesa/x64" -name 'lvp_icd*.json' | head -1)")
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "VK_ADD_LAYER_PATH=C:\VulkanSDK\Bin" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      - run: dotnet build 3DEngine.slnx -warnaserror

      - run: dotnet test 3DEngine.Tests --no-build --logger "trx;LogFileName=results.trx"
        env:
          E3D_REQUIRE_VALIDATION: '1'
          E3D_REQUIRE_VULKAN: '1'

      - name: Build a game from the package and draw it under the validation layer
        run: build/play-game.sh Pusher

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-windows
          path: |
            3DEngine.Tests/TestResults/
            captures/

  macos:
    # Apple silicon, whose GPU MoltenVK draws on through Metal.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v6
        with:
          path: build/tools/slang
          key: slang-${{ runner.os }}-${{ hashFiles('build/fetch-slang.sh') }}

      - run: build/fetch-slang.sh

      # MoltenVK, the loader and the validation layer from Homebrew, the loader found by the dynamic
      # linker's fallback path, where .NET looks for it, and MoltenVK and the layer named to it.
      - name: Install MoltenVK, the Vulkan loader and the validation layer
        run: |
          brew install molten-vk vulkan-loader vulkan-validationlayers
          prefix=$(brew --prefix)
          echo "DYLD_FALLBACK_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json" >> "$GITHUB_ENV"
          echo "VK_ADD_LAYER_PATH=$(brew --prefix vulkan-validationlayers)/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"

      - run: dotnet build 3DEngine.slnx -warnaserror

      - run: dotnet test 3DEngine.Tests --no-build --logger "trx;LogFileName=results.trx"
        env:
          E3D_REQUIRE_VALIDATION: '1'
          E3D_REQUIRE_VULKAN: '1'

      - name: Build a game from the package and draw it under the validation layer
        run: build/play-game.sh Pusher

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-macos
          path: |
            3DEngine.Tests/TestResults/
            captures/
